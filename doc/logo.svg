<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="38pt" height="38pt"
     viewBox="0 0 64 64"
     role="img"
     aria-label="TRIOS">
  <title>TRIOS</title>
  <desc>Option 6 mark on a 64-unit grid. The tile starts at 5,5 and is 55x55, so its center is 32.5,32.5. The white and steel columns mirror each other around x=32.5. The center frame is 11x11 and the gold core is 7x7, both centered on 32.5,32.5.</desc>
  <defs>
    <linearGradient id="tile" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2C383E"/>
      <stop offset="1" stop-color="#1F2A30"/>
    </linearGradient>
    <linearGradient id="steel" x1="36" y1="13" x2="48" y2="51" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#97A3AA"/>
      <stop offset="1" stop-color="#758087"/>
    </linearGradient>
    <linearGradient id="gold" x1="29" y1="30" x2="35" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E6C674"/>
      <stop offset="1" stop-color="#DAB98E"/>
    </linearGradient>
  </defs>
  <rect x="5" y="5" width="55" height="55" rx="9.5" ry="9.5" fill="url(#tile)"/>
  <path fill="#FFFFFF" d="M31 13v42h-9V24l4-3-12-2v-6z"/>
  <path fill="url(#steel)" d="M34 13v42h9V24l-4-3 12-2v-6z"/>
  <rect x="27" y="27" width="11" height="11" fill="#1F2A30"/>
  <rect x="29" y="29" width="7" height="7" fill="url(#gold)"/>
</svg>

