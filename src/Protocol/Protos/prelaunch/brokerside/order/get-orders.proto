syntax = "proto3";

option csharp_namespace = "Wst.Trios.Core.Protocol.Prelaunch.BrokerSide.Order";

package wst.trios.core.protocol.prelaunch.brokerside.order;

import "prelaunch/brokerside/order/entities.proto";

message GetOrdersRequest {
  int32 page_number = 1;
  int32 page_size = 2;
}

message GetOrdersSuccess {
  repeated Order items = 1;
  int32 page_number = 2;
  int32 page_size = 3;
}

message GetOrdersError {
  string code = 1;
  string message = 2;
}

message GetOrdersResponse {
  oneof result {
    GetOrdersSuccess success = 1;
    GetOrdersError error = 2;
  }
}
