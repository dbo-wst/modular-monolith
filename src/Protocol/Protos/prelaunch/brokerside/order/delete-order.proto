syntax = "proto3";

option csharp_namespace = "Wst.Trios.Core.Protocol.Prelaunch.BrokerSide.Order";

package wst.trios.core.protocol.prelaunch.brokerside.order;

message DeleteOrderRequest {
  bytes order_id = 1;
}

message DeleteOrderSuccess {
  bytes order_id = 1;
}

message DeleteOrderError {
  string code = 1;
  string message = 2;
}

message DeleteOrderResponse {
  oneof result {
    DeleteOrderSuccess deleted = 1;
    DeleteOrderError error = 2;
  }
}
