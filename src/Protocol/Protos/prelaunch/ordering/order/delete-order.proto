syntax = "proto3";

option csharp_namespace = "Acme.Core.Protocol.Prelaunch.Ordering.Order";

package acme.core.protocol.prelaunch.ordering.order;

message DeleteOrderRequest {
  bytes order_id = 1;
}

message DeleteOrderSuccess {
  bytes order_id = 1;
}

message DeleteOrderError {
  string code = 1;
  string message = 2;
}

message DeleteOrderResponse {
  oneof result {
    DeleteOrderSuccess deleted = 1;
    DeleteOrderError error = 2;
  }
}
