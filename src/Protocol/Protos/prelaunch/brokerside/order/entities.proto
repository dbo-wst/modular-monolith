syntax = "proto3";

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Wst.Trios.Core.Protocol.Prelaunch.BrokerSide.Order";

package wst.trios.core.protocol.prelaunch.brokerside.order;

enum Side {
  SIDE_UNSPECIFIED = 0;
  BUY = 1;
  SELL = 2;
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  NEW = 1;
  PARTIALLY_FILLED = 2;
  FILLED = 3;
  CANCELLED = 4;
  REJECTED = 5;
}

message Order {
  bytes order_id = 1;
  optional bytes broker_id = 2;
  optional bytes instrument_id = 3;
  optional bytes venue_id = 4;
  optional string number = 5;
  google.protobuf.Timestamp effective_date = 10;
  optional string quantity = 6;
  optional string price = 7;
  optional Side side = 8;
  optional Status status = 9;
}
