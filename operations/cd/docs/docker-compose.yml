services:
  docs:
    image: "${IMAGE_TAG:-build.steubing.com/acme-docs:latest}"
    container_name: ${CONTAINER_NAME:-acme-docs}
    restart: unless-stopped
    pull_policy: never
    # Frankfurt am Main local time (CET/CEST, DST-aware)
    environment:
      TZ: Europe/Berlin
    networks:
      - acme-network
      - rp

networks:
  acme-network:
    name: acme-network
    external: true
  rp:
    external: true
    name: rp_default_net
