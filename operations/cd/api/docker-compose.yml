services:
  api:
    image: "${IMAGE_TAG:-build.steubing.com/acme-api:latest}"
    container_name: ${CONTAINER_NAME:-acme-api}
    restart: unless-stopped
    pull_policy: never
    ports:
      - "80"
    env_file:
      - path: ${ENV_FILE:-./conf.d/.env}
        required: false
    volumes:
      - acme-api-dp-keys:/root/.aspnet/DataProtection-Keys
      - acme-api-logs:/app/publish/logs
    networks:
      - acme-network
      - rp

networks:
  acme-network:
    name: acme-network
    external: true
  rp:
    external: true
    name: rp_default_net

volumes:
  acme-api-dp-keys:
    external: true
    name: acme-api-dp-keys
  acme-api-logs:
    external: true
    name: acme-api-logs
