services:
  docs:
    build:
      context: ../../..
      dockerfile: operations/ci/docs/Dockerfile
    image: "${IMAGE_TAG:-acme-docs:latest}"
    container_name: ${CONTAINER_NAME:-acme-docs}
    restart: unless-stopped
    pull_policy: build
    ports:
      - "${DOCS_HOST_PORT:-5082}:80"
    networks:
      - acme-network
      - rp

networks:
  acme-network:
    name: acme-network
    external: true
  rp:
    external: true
    name: rp_default_net
