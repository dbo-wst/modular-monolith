services:
  core-api:
    image: "${IMAGE_TAG:-build.steubing.com/template-core-api:latest}"
    container_name: ${CONTAINER_NAME:-template-core-api}
    restart: unless-stopped
    pull_policy: never
    env_file:
      - path: ${ENV_FILE:-./conf.d/.env}
        required: false
    volumes:
      - template-core-api-dp-keys:/root/.aspnet/DataProtection-Keys
      - template-core-api-logs:/app/publish/logs
    networks:
      - template-network
      - rp

networks:
  template-network:
    name: template-network
    external: true
  rp:
    external: true
    name: rp_default_net

volumes:
  template-core-api-dp-keys:
    external: true
    name: template-core-api-dp-keys
  template-core-api-logs:
    external: true
    name: template-core-api-logs
