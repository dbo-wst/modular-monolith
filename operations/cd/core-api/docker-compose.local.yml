services:
  core-api:
    build:
      context: ../../..
      dockerfile: operations/ci/core-api/Dockerfile
    image: "${IMAGE_TAG:-template-core-api:latest}"
    container_name: ${CONTAINER_NAME:-template-core-api}
    restart: unless-stopped
    pull_policy: build
    env_file:
      - path: ${ENV_FILE:-./conf.d/.env}
        required: false
    ports:
      - "${CORE_API_HOST_PORT:-5080}:80"
    volumes:
      - template-core-api-dp-keys:/root/.aspnet/DataProtection-Keys
      - template-core-api-logs:/app/publish/logs
    networks:
      - template-network
      - mssql-network
      - rp

networks:
  template-network:
    name: template-network
    external: true
  mssql-network:
    name: mssql-network
    external: true
  rp:
    external: true
    name: rp_default_net

volumes:
  template-core-api-dp-keys:
    external: true
    name: template-core-api-dp-keys
  template-core-api-logs:
    external: true
    name: template-core-api-logs
