services:
  docs:
    image: "${IMAGE_TAG:-build.steubing.com/template-docs:latest}"
    container_name: ${CONTAINER_NAME:-template-docs}
    restart: unless-stopped
    pull_policy: never
    networks:
      - template-network
      - rp

networks:
  template-network:
    name: template-network
    external: true
  rp:
    external: true
    name: rp_default_net
