services:
  docs:
    build:
      context: ../../..
      dockerfile: operations/ci/docs/Dockerfile
    image: "${IMAGE_TAG:-template-docs:latest}"
    container_name: ${CONTAINER_NAME:-template-docs}
    restart: unless-stopped
    pull_policy: build
    ports:
      - "${DOCS_HOST_PORT:-5082}:80"
    networks:
      - template-network
      - rp

networks:
  template-network:
    name: template-network
    external: true
  rp:
    external: true
    name: rp_default_net
