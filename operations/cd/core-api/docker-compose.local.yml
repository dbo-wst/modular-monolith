services:
  core-api:
    build:
      context: ../../..
      dockerfile: operations/ci/core-api/Dockerfile
    image: "${IMAGE_TAG:-acme-core-api:latest}"
    container_name: ${CONTAINER_NAME:-acme-core-api}
    restart: unless-stopped
    pull_policy: build
    env_file:
      - path: ${ENV_FILE:-./conf.d/.env}
        required: false
    # Frankfurt am Main local time (CET/CEST, DST-aware)
    environment:
      TZ: Europe/Berlin
    ports:
      - "${CORE_API_HOST_PORT:-5080}:80"
    volumes:
      - acme-core-api-dp-keys:/root/.aspnet/DataProtection-Keys
      - acme-core-api-logs:/app/publish/logs
    networks:
      - acme-network
      - mssql-network
      - rp

networks:
  acme-network:
    name: acme-network
    external: true
  mssql-network:
    name: mssql-network
    external: true
  rp:
    external: true
    name: rp_default_net

volumes:
  acme-core-api-dp-keys:
    external: true
    name: acme-core-api-dp-keys
  acme-core-api-logs:
    external: true
    name: acme-core-api-logs
